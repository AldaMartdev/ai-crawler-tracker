name: Publish Packages
on:
  push:
    tags: ["v*"]

permissions:
  # Requerido por npm Trusted Publishing (OIDC) — genera provenance automáticamente
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm -r publish --access public --no-git-checks
